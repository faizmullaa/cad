name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Restore application source
        shell: pwsh
        run: |
          python -c "import base64,lzma,pathlib; p=pathlib.Path('build_payload.py.xz.b64'); pathlib.Path('pdf_cad_register.py').write_bytes(lzma.decompress(base64.b64decode(p.read_text(encoding='utf-8'))))"
          python -m py_compile pdf_cad_register.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_pdf_cad.txt

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "PDF and CAD Register" --collect-all ezdxf --collect-all pymupdf --collect-all sv_ttk --hidden-import openpyxl --hidden-import pymupdf pdf_cad_register.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PDF-and-CAD-Register-Windows
          path: dist/PDF and CAD Register.exe
          if-no-files-found: error
          retention-days: 30
